name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ml-service:
    name: ML service train + eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Train models
        run: |
          python train_schedule_model.py
          python train_compliance_model.py
      - name: Evaluate compliance classifier (held-out phrasing)
        run: python -m eval.eval_compliance
      - name: Evaluate schedule model monotonicity
        run: python -m eval.eval_schedule_risk